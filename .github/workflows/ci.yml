name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # The Ubuntu runner ships the Android SDK; Gradle fetches the platform it needs.
      - name: Unit tests, lint, release build (unsigned)
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease -Punsigned
      - name: No internet permission, ever
        run: |
          for m in $(find app/build/intermediates/merged_manifest -name AndroidManifest.xml); do
            echo "Checking $m"
            if grep -q 'android.permission.INTERNET' "$m"; then echo "INTERNET permission found"; exit 1; fi
          done
      # Permissions only from docs/permissions.txt; colors, dp and sp only in Tokens.kt; English UI
      # strings without "OK" or exclamation marks; no dash, personal path, forbidden word or leftover
      # from the template in the repository; a security review less than 6 months old; a changelog
      # entry for this version.
      - name: Release checks
        run: python3 scripts/checks.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: still-unsigned
          path: app/build/outputs/apk/release/*.apk
